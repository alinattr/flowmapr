<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lgd" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="lgd2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Bar 1  large, top -->
  <rect x="4" y="5" width="32" height="11" rx="4" fill="url(#lgd)"/>
  <!-- Bar 2  medium, middle -->
  <rect x="4" y="20" width="23" height="11" rx="4" fill="url(#lgd)" opacity="0.85"/>
  <!-- Bar 3  small, bottom -->
  <rect x="4" y="35" width="15" height="10" rx="4" fill="url(#lgd)" opacity="0.7"/>
  <!-- Node connection handles  white dots -->
  <circle cx="36" cy="10.5" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="27" cy="25.5" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="19" cy="40" r="2.5" fill="white" opacity="0.7"/>
  <!-- Connecting lines between bars -->
  <path d="M10 17.5 L10 19" stroke="url(#lgd2)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M10 32.5 L10 34" stroke="url(#lgd2)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
