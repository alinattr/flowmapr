<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>
  <!-- Bar 1  large, top -->
  <rect x="4" y="5" width="32" height="11" rx="4" fill="url(#lg)"/>
  <!-- Bar 2  medium, middle -->
  <rect x="4" y="20" width="23" height="11" rx="4" fill="url(#lg)" opacity="0.85"/>
  <!-- Bar 3  small, bottom -->
  <rect x="4" y="35" width="15" height="10" rx="4" fill="url(#lg)" opacity="0.7"/>
  <!-- Node connection handles  white dots at right edge of each bar -->
  <circle cx="36" cy="10.5" r="2.5" fill="white" opacity="0.65"/>
  <circle cx="27" cy="25.5" r="2.5" fill="white" opacity="0.65"/>
  <circle cx="19" cy="40" r="2.5" fill="white" opacity="0.65"/>
  <!-- Tiny connecting arrows between bars -->
  <path d="M10 17.5 L10 19" stroke="url(#lg2)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M10 32.5 L10 34" stroke="url(#lg2)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
